---
services:
  start_kalium:
    # built and published by the GitHub Actions workflow
    # latest = newest release tag; dev = newest main build
    image: ${KALIUM_DOCKER_IMAGE:-ghcr.io/medizininformatik-initiative/dup-kalium360:v1.0.3}
    container_name: kalium360
    environment:
      TZ: Europe/Berlin
      KALIUM_DATA_DIR: /data
      KALIUM_OUTPUT_DIR: /output
      KALIUM_WORKING_DIR: /work
      KALIUM_CRTDL: ${KALIUM_CRTDL}
      KALIUM_SITE_PSEUDONYM: ${KALIUM_SITE_PSEUDONYM}
    volumes:
      # R-Scripts
      - ./R:/app/R:ro
      - ./Main.R:/app/Main.R:ro
      # config files
      - ./config.R:/app/config.R:ro
      - ./unit_conversion.csv:/app/unit_conversion.csv:ro
      # input data folder
      - ${KALIUM_DATA_PATH}:/data:ro
      # output folder
      - ${KALIUM_OUTPUT_PATH}:/output
      # temp DuckDB working folder
      - ${KALIUM_WORKING_PATH}:/work
