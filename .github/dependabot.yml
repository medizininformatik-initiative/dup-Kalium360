---
# Dependabot version updates (https://docs.github.com/code-security/dependabot)
# - github-actions: keeps the SHA-pinned actions in the workflows up to date
# - docker: updates the base image in the Dockerfile
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
