---
# Dependabot version updates (https://docs.github.com/code-security/dependabot)
# - github-actions: keeps the SHA-pinned actions in the workflows up to date,
#   grouped into one pull request per week
# - docker: updates the base image in the Dockerfile
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # the R version is changed deliberately, not by Dependabot: it can change
    # package behavior and results, and r-version in ci.yml must match it.
    # Patch releases (bug fixes) are still proposed.
    ignore:
      - dependency-name: rocker/r-ver
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
