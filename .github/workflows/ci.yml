---
name: CI

# "on" is quoted so yamllint's truthy rule does not flag it as a boolean
"on":
  push:
    branches: [main]
    # release tags must follow the SemVer scheme vMAJOR.MINOR.PATCH;
    # docker/metadata-action validates the tag format in the docker job
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # derived from the lint examples at
  # https://github.com/r-lib/actions/tree/v2-branch/examples; the lint-project
  # variant is used because this repository is a plain R project, not an
  # R package (no DESCRIPTION for lintr::lint_package())
  lint-r:
    name: Lint R
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # same R version as the Docker image
          r-version: '4.4.2'

      - name: Install lintr
        run: install.packages("lintr")
        shell: Rscript {0}

      - name: Lint root directory
        run: lintr::lint_dir()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  lint-json:
    name: Lint JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON syntax (jq)
        run: |
          jq empty *.json
          echo "All JSON files are syntactically valid."

  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: python3 -m pip install --quiet yamllint

      - name: Run yamllint (errors fail, style warnings do not)
        # lints all *.yml/*.yaml recursively from the repo root,
        # including the workflow files in .github/workflows
        run: yamllint -f parsable -c yamllint.yaml .

  docker:
    name: Build image and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # all git tags are needed to find the highest
          # version for the `latest` image tag
          fetch-depth: 0

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          # only findings with severity error or above fail the job
          failure-threshold: error

      # Published image tags on ghcr.io (generated by docker/metadata-action):
      # - git tag as vMAJOR.MINOR.PATCH (SemVer): image gets this version tag,
      #   and `latest` is also updated if it is the highest published version.
      #   Tags that are not valid SemVer fail the build; prerelease tags like
      #   v1.2.3-rc.1 are published but never promote `latest`.
      # - push to the main branch: image gets the `dev` tag, so the newest
      #   changes can be tested without releasing a version.
      # - pull requests and manual runs: image is built and scanned, but not
      #   published.
      # The one publishing rule that no action provides: `latest` may only
      # move to the highest published release, so the tag is compared
      # against all release tags of the repository here.
      - name: Compare tag with highest release tag
        id: latest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          # strict release form: prerelease tags are not candidates for latest
          LATEST=$(git tag --list 'v*' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort --version-sort | tail -n 1)
          if [ "$GITHUB_REF_NAME" = "$LATEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            echo "'$GITHUB_REF_NAME' is the highest published release:"
            echo "also publishing the 'latest' image tag"
          else
            echo "'$GITHUB_REF_NAME' is not the highest published version ($LATEST):"
            echo "not updating the 'latest' image tag"
          fi

      # Replaces the previous SemVer check and tag assembly: the
      # type=semver entry fails the build if a tag is not valid SemVer.
      - name: Generate docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/medizininformatik-initiative/dup-kalium360
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main' }}

      # the docs of a release tag must match the tag version: its
      # docker-compose.yml pins the image to exactly that version (back to
      # `latest` on main afterwards), and the README references the version
      - name: Check pinned release version
        if: github.ref_type == 'tag'
        run: |
          IMAGE=ghcr.io/medizininformatik-initiative/dup-kalium360
          if ! grep -Fq "$IMAGE:$GITHUB_REF_NAME}" docker-compose.yml;
          then
            echo "::error::docker-compose.yml of this tag must pin the image to $GITHUB_REF_NAME!"
            echo "::error::set the KALIUM_DOCKER_IMAGE tag to $GITHUB_REF_NAME before tagging (then 'latest' again in main)"
            exit 1
          fi
          if ! grep -Fq "$IMAGE:$GITHUB_REF_NAME" README.md; then
            echo "::warning::$GITHUB_REF_NAME is not referenced in the README of this tag!"
            echo "::warning::please document this version in README.md (e.g. the 'Releasen' section)"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kalium360:ci

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.tags != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GitHub Container Registry
        if: steps.meta.outputs.tags != ''
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            docker tag kalium360:ci "$tag"
            docker push "$tag"
          done <<< "$META_TAGS"

      # Security check of the built image. Fails on CRITICAL vulnerabilities
      # for which a fix is available (base image may need a rebuild for that).
      # Raise `severity` (e.g. HIGH,CRITICAL) to make the check stricter.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kalium360:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scan-timeout: 10m

      # Additional report including HIGH findings, uploaded as artifact
      - name: Trivy report (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kalium360:ci
          format: sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          output: trivy-image-report.sarif

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.sarif
          if-no-files-found: warn
